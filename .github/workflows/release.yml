name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION.txt
      - minibin.ini
      - src/**
      - assets/**
      - scripts/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if (-not $version) { throw "VERSION.txt is empty" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Public baseline check
        shell: pwsh
        run: python scripts/check_public_baseline.py

      - name: Build release package
        shell: pwsh
        run: ./scripts/build_release.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist/MiniBin - $env:VERSION.zip"
          if (-not (Test-Path $zip)) { throw "Release archive not found: $zip" }

          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists."

            $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG"
            $release = $releaseJson | ConvertFrom-Json
            foreach ($asset in $release.assets) {
              if ($asset.name -like "*.zip") {
                gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" -f label="MiniBin - $env:VERSION.zip" | Out-Null
              }
            }
            exit 0
          }

          @"
          ## MiniBin $env:VERSION

          Public Windows release of MiniBin.

          ### Highlights
          - Windows system-tray utility for Recycle Bin management.
          - Manual and automatic cleanup.
          - Five tray-icon fill states.
          - Empty `My Function` extension point for custom features.
          - Portable package; no installer required.

          See `CHANGELOG.md` and `docs/` for details.
          "@ | Set-Content RELEASE_NOTES.md -Encoding utf8

          $assetSpec = "$zip#MiniBin - $env:VERSION.zip"
          gh release create $env:TAG $assetSpec --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MiniBin $env:VERSION" --notes-file RELEASE_NOTES.md
